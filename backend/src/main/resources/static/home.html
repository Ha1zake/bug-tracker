<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная — Баг-трекер</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="home.html" class="sidebar-brand">Баг-трекер</a>
      <nav class="sidebar-nav" aria-label="Основная навигация">
        <a href="home.html" class="sidebar-link is-active">Главная</a>
      </nav>
      <p class="sidebar-section-title">Мои проекты</p>
      <nav id="sidebar-projects" class="sidebar-nav" aria-label="Мои проекты"></nav>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <span id="current-user-name" class="topbar-user"></span>
        <button type="button" id="logout-btn" class="btn btn--secondary btn--sm">
          Выйти
        </button>
      </header>

      <main class="content">
        <p class="breadcrumbs">Главная</p>

        <div class="page-header">
          <div>
            <h1 id="greeting-title" class="page-title">Здравствуйте</h1>
            <p class="page-subtitle">Ваши проекты и управление задачами команды</p>
          </div>
          <a href="project-create.html" class="btn btn--primary">
            + Создать проект
          </a>
        </div>

        <h2 class="section-heading">
          Мои проекты
          <span id="projects-count" class="count-pill">0</span>
        </h2>

        <div id="projects-empty" class="empty-state" hidden>
          <h3 class="empty-state-title">У вас пока нет проектов</h3>
          <p class="empty-state-text">
            Создайте первый проект, чтобы начать отслеживать баги команды.
          </p>
          <a href="project-create.html" class="btn btn--primary">
            + Создать проект
          </a>
        </div>

        <div id="projects-grid" class="project-grid"></div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
