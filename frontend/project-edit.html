<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Редактирование проекта — Баг-трекер</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="home.html" class="sidebar-brand">Баг-трекер</a>
      <nav class="sidebar-nav" aria-label="Основная навигация">
        <a href="home.html" class="sidebar-link">Главная</a>
      </nav>
      <p class="sidebar-section-title">Мои проекты</p>
      <nav id="sidebar-projects" class="sidebar-nav" aria-label="Мои проекты"></nav>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <span id="current-user-name" class="topbar-user"></span>
        <button type="button" id="logout-btn" class="btn btn--secondary btn--sm">
          Выйти
        </button>
      </header>

      <main class="content">
        <div id="page-error" class="alert alert--error" role="alert" hidden>
          <span class="alert-title">Доступ ограничен</span>
          <span id="page-error-text"></span>
        </div>

        <div id="edit-view" hidden>
          <p class="breadcrumbs">
            <a href="home.html">Главная</a> /
            <a id="breadcrumb-project-link" href="#"></a> /
            Редактирование
          </p>

          <div class="page-header">
            <div>
              <h1 class="page-title">Редактирование проекта</h1>
              <p id="project-subtitle" class="page-subtitle"></p>
            </div>
          </div>

          <section class="panel panel--narrow">
            <h2 class="panel-title">Основные сведения</h2>

            <div id="form-error-alert" class="alert alert--error" role="alert" hidden>
              <span class="alert-title">Проверьте данные</span>
              <span id="form-error-text"></span>
            </div>

            <form id="edit-project-form" novalidate>
              <div class="form-group">
                <div class="label-row">
                  <label class="form-label" for="name">Название проекта *</label>
                  <span class="field-error" id="error-name"></span>
                </div>
                <input
                  class="form-input"
                  type="text"
                  id="name"
                  name="name"
                  maxlength="120"
                  required
                />
              </div>

              <div class="form-group">
                <div class="label-row">
                  <label class="form-label" for="description">Описание проекта</label>
                  <span class="field-error" id="error-description"></span>
                </div>
                <textarea
                  class="form-textarea"
                  id="description"
                  name="description"
                ></textarea>
              </div>

              <div class="form-actions">
                <button type="submit" id="submit-btn" class="btn btn--primary">
                  Сохранить изменения
                </button>
                <a id="cancel-link" href="home.html" class="btn btn--secondary">
                  Отмена
                </a>
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/project-edit.js"></script>
</body>
</html>
