<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Создать аккаунт — Баг-трекер</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand">Баг-трекер</a>
    <a href="login.html" class="header-nav">Вход / Регистрация</a>
  </header>

  <main class="page-center">
    <section class="card">
      <div id="form-error-alert" class="alert alert--error" role="alert" hidden>
        <span class="alert-title">Проверьте данные</span>
        <span id="form-error-text"></span>
      </div>

      <p class="eyebrow">Регистрация</p>
      <h1 class="card-title">Создать аккаунт</h1>
      <p class="card-subtitle">Один аккаунт для всех ваших проектов</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="displayName">Имя и фамилия</label>
            <span class="field-error" id="error-displayName"></span>
          </div>
          <input
            class="form-input"
            type="text"
            id="displayName"
            name="displayName"
            placeholder="Алексей Смирнов"
            maxlength="100"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="email">Электронная почта</label>
            <span class="field-error" id="error-email"></span>
          </div>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="alexey@komanda.ru"
            maxlength="254"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="password">Пароль</label>
            <span class="field-error" id="error-password"></span>
          </div>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••••••"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="confirmPassword">Повторите пароль</label>
            <span class="field-error" id="error-confirmPassword"></span>
          </div>
          <input
            class="form-input"
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="••••••••••••"
            autocomplete="new-password"
            required
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn--primary btn--full">
          Зарегистрироваться
        </button>
      </form>

      <hr class="card-divider" />

      <p class="footer-prompt">Уже есть аккаунт?</p>
      <a href="login.html" class="btn btn--secondary btn--full">
        Войти
      </a>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
